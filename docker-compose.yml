version: '3.8'

services:
  # PostgreSQL + TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: netmon-db
    env_file: .env
    environment:
      POSTGRES_DB: netmon
      POSTGRES_USER: netmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmon_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmon"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - For Celery task queue and caching
  redis:
    image: redis:7-alpine
    container_name: netmon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmon-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://netmon:${POSTGRES_PASSWORD:-netmon_dev_password}@db:5432/netmon
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DOCKER_PROXY_URL=http://docker-proxy:2375
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - ssl_store:/app/ssl_store
      - nginx_ssl:/etc/nginx/ssl
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Celery Worker - Background task processing
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmon-celery-worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://netmon:${POSTGRES_PASSWORD:-netmon_dev_password}@db:5432/netmon
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info --concurrency=8
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Celery Beat - Task scheduler
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netmon-celery-beat
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://netmon:${POSTGRES_PASSWORD:-netmon_dev_password}@db:5432/netmon
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.tasks beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Docker socket proxy — restricts API access to container kill only
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: netmon-docker-proxy
    environment:
      CONTAINERS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Nginx Reverse Proxy
  # Disabled by default in this deployment: a host-level nginx fronts the backend
  # on netmon.westsideunion.com -> 127.0.0.1:8000. To re-enable the container,
  # run `docker compose --profile bundled-nginx up -d nginx`.
  nginx:
    image: nginx:alpine
    container_name: netmon-nginx
    profiles: ["bundled-nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      ssl-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Init container to seed default SSL certs into named volume
  ssl-init:
    image: alpine:latest
    container_name: netmon-ssl-init
    volumes:
      - ./nginx/ssl:/source-ssl:ro
      - nginx_ssl:/etc/nginx/ssl
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f /etc/nginx/ssl/cert.pem ]; then
          echo "Seeding default SSL certs into volume..."
          cp /source-ssl/* /etc/nginx/ssl/ 2>/dev/null || true
          echo "Done."
        else
          echo "SSL certs already exist, skipping seed."
        fi
    restart: "no"

  # React Frontend (dev only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netmon-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  ssl_store:
  nginx_ssl:

networks:
  default:
    name: netmon-network
