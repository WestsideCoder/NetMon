[tool.poetry]
name = "netmon-backend"
version = "0.9.0.2"
description = "Network Monitoring System - Professional Edition"
authors = ["Your Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pydantic = {extras = ["email"], version = "^2.5.3"}
pydantic-settings = "^2.1.0"
PyJWT = {extras = ["crypto"], version = "^2.8.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^4.1.0"
python-multipart = "^0.0.6"
celery = {extras = ["redis"], version = "^5.3.4"}
redis = "^5.0.1"
pysnmp-lextudio = "^5.0.0"
python-dotenv = "^1.0.0"
websockets = "^12.0"
aiosmtplib = "^3.0.1"
jinja2 = "^3.1.3"
ldap3 = "^2.9.1"
aiohttp = "^3.9.1"
icmplib = "^3.0.4"
pyyaml = "^6.0.1"
httpx = "^0.26.0"
pypsrp = "^0.8.1"
gssapi = "^1.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.8.0"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
