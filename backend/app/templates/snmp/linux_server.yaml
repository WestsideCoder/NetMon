name: Linux Server
device_type: server
description: Linux hosts with Host Resources MIB (CPU, memory, disk via SNMP walk)
sys_object_id_pattern: "1.3.6.1.4.1.8072"
sys_descr_pattern: "Linux"
oids:
  "1.3.6.1.2.1.1.3.0":
    name: sysUpTime
    type: timeticks
  "1.3.6.1.2.1.25.1.6.0":
    name: hrSystemProcesses
    type: gauge
alert_rules:
  host_resources: true
